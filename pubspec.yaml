name: auravision_3d_rf
description: AuraVision 3D RF - Arabic RF/AR research-grade sensing HUD.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  ar_flutter_plugin_plus: ^1.1.3
  vector_math: ^2.2.0
  ffi: ^2.2.0
  flutter_blue_plus: 2.3.13
  tflite_flutter: ^0.12.1
  aura_rf_ffi:
    path: packages/aura_rf_ffi

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
